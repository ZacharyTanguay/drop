# ZOUGCLOUD(ZC-008): playtime lives in its own crate rather than in drop-app or
# in upstream's database models. Entirely new files have no conflict surface
# when rebasing onto a new upstream release, and keeping the state out of
# drop.db means an upstream schema change can never cost a member their hours.
[package]
name = "playtime"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.19.1"
